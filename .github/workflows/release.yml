name: Release SDL2 Benchmarks (Miyoo Mini)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (first release: v1.0.0). Blank bumps PATCH after the first release."
        required: false
        type: string
      dry_run:
        description: "Build and package without checking or publishing a GitHub Release (for act)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: Pre-release checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          TRIGGER_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$REQUESTED_TAG" ]]; then
            TAG="$REQUESTED_TAG"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            if [[ -z "$LATEST_TAG" ]]; then
              echo "No three-part release tag exists yet. Enter v1.0.0 explicitly for the first SemVer release."
              exit 1
            fi
            VER="${LATEST_TAG#v}"
            MAJOR="${VER%%.*}"
            REST="${VER#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "No tag given -- auto-bumping latest release $LATEST_TAG -> $TAG"
          else
            TAG="$TRIGGER_TAG"
          fi

          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "Tag '$TAG' does not match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease format"
            exit 1
          fi

          VERSION="${TAG#v}"
          PRERELEASE=false
          [[ "$TAG" == *-* ]] && PRERELEASE=true
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG at $TARGET_SHA (prerelease=$PRERELEASE)"

      - name: Check release target and duplicates
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TARGET_SHA="${{ steps.version.outputs.target_sha }}"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n1 "$TAG")
            if [[ "$TAG_SHA" != "$TARGET_SHA" ]]; then
              echo "Tag '$TAG' points to $TAG_SHA, not release commit $TARGET_SHA"
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists — bump the version"
            exit 1
          fi

      - name: Verify build.sh is present
        run: |
          if [[ ! -x "build.sh" ]]; then
            echo "build.sh missing or not executable"
            exit 1
          fi

  build:
    name: Build
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout local dry run
        if: ${{ inputs.dry_run }}
        uses: actions/checkout@v4

      - name: Checkout release commit
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify local dry-run commit
        if: ${{ inputs.dry_run }}
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.target_sha }}"

      - name: Build through mm-buildbot
        env:
          TITLE_GIT_VERSION: ${{ needs.preflight.outputs.tag }}
        run: |
          ./build.sh

      - name: Verify build artifacts and embedded version
        run: |
          ls -la app-dist/sdl_bench/bin/
          file app-dist/sdl_bench/bin/*
          test "$(find app-dist/sdl_bench/bin -maxdepth 1 -type f | wc -l)" -eq 9
          strings app-dist/sdl_bench/bin/sdl2_title | grep -F -- "${{ needs.preflight.outputs.tag }}"

      - name: Package release archive
        id: package
        run: |
          TAG="${{ needs.preflight.outputs.tag }}"
          ARCHIVE="sdl_bench-${TAG}.tar.gz"
          tar -czf "$ARCHIVE" -C app-dist sdl_bench/
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          cat "${ARCHIVE}.sha256"

      - name: Upload build artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: sdl_bench-${{ needs.preflight.outputs.tag }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [preflight, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sdl_bench-${{ needs.preflight.outputs.tag }}
          path: output

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.preflight.outputs.tag }}"
          TARGET_SHA="${{ needs.preflight.outputs.target_sha }}"
          PRERELEASE="${{ needs.preflight.outputs.prerelease }}"

          RELEASE_FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            output/*.tar.gz \
            output/*.sha256 \
            --target "$TARGET_SHA" \
            "${RELEASE_FLAGS[@]}" \
            --title "SDL2 Benchmarks (Miyoo Mini) $TAG" \
            --notes "$(cat <<NOTES
          ## SDL2 Benchmarks for Miyoo Mini — $TAG

          Cross-compiled for \`arm-linux-gnueabihf\` through the shared \`mm-buildbot\` SDL/toolchain build.

          ### Artifacts
          | File | Description |
          |------|-------------|
          | \`sdl_bench-${TAG}.tar.gz\` | \`app-dist/sdl_bench\` (bin + lib + assets + launch.sh) |
          | \`sdl_bench-${TAG}.tar.gz.sha256\` | SHA-256 checksum |

          ### Install
          Extract to \`/mnt/SDCARD/App/sdl_bench\` on the device, then restart MainUI.

          ### Build info
          - Commit: $TARGET_SHA
          - Build system: [XK9274/mm-buildbot](https://github.com/XK9274/mm-buildbot)
          NOTES
          )"
